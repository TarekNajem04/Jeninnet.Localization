<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Jeninnet.Localization — Blazor Hybrid</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; margin: 0; background: #f5f5f5; color: #333; }
        .page { max-width: 760px; margin: 0 auto; padding: 24px; }
        header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #444; padding-bottom: 12px; }
        header h1 { margin: 0; font-size: 22px; }
        ul.catalog { list-style: none; padding: 0; margin: 0; }
        li.book { background: #ffffff; border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin: 10px 0; }
        .book-title { font-weight: 600; font-size: 16px; }
        .book-description { color: #555; margin: 6px 0; }
        .book-meta { color: #777; font-size: 13px; }
        .row { margin: 10px 0; }
        label { display: inline-block; min-width: 120px; font-weight: 500; }
        select, input { padding: 6px; font-size: 14px; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        .message { color: #2e7d32; }
        .error { color: #c62828; }
        section.demo { margin-top: 24px; padding-top: 12px; border-top: 1px dashed #bbb; color: #666; font-size: 13px; }
    </style>
</head>
<body>
    <div id="app">Loading the reference Blazor Hybrid host…</div>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
