name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'integrations/**'
      - 'samples/**'
      - '**.csproj'
      - '**.slnx'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'integrations/**'
      - 'samples/**'
      - '**.csproj'
      - '**.slnx'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  format:

    name: Format

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jeninnet.Localization.slnx

      - name: Verify formatting
        run: dotnet format Jeninnet.Localization.slnx --verify-no-changes --no-restore

  build-and-test:

    name: Build & Test (${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jeninnet.Localization.slnx

      - name: Install MAUI workload (Windows only)
        if: matrix.os == 'windows-latest'
        run: dotnet workload install maui

      - name: Install Windows App Runtime (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsAppRuntime.1.8 --exact --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Runtime installation failed with exit code $LASTEXITCODE."
          }

      - name: Restore Windows host solution
        if: matrix.os == 'windows-latest'
        run: dotnet restore Jeninnet.Localization.Windows.slnx

      - name: Build
        run: dotnet build Jeninnet.Localization.slnx --configuration Release --no-restore

      - name: Build Windows host solution
        if: matrix.os == 'windows-latest'
        run: dotnet build Jeninnet.Localization.Windows.slnx --configuration Release --no-restore

      - name: Verify documentation snippets
        run: >
          dotnet run
          --project samples/Jeninnet.Localization.Docs/Jeninnet.Localization.Docs.csproj
          --configuration Release
          --no-build

      - name: Test (library suite)
        shell: bash
        run: |
          dotnet test tests/Jeninnet.Localization.Tests/Jeninnet.Localization.Tests.csproj \
            --configuration Release \
            --framework net10.0 \
            --no-build \
            --logger "trx;LogFileName=library-net10.0.trx" \
            --results-directory "TestResults/${{ matrix.os }}"
          dotnet test tests/Jeninnet.Localization.Tests/Jeninnet.Localization.Tests.csproj \
            --configuration Release \
            --framework net11.0 \
            --no-build \
            --logger "trx;LogFileName=library-net11.0.trx" \
            --results-directory "TestResults/${{ matrix.os }}"

      - name: Test (reference application suites)
        shell: bash
        run: |
          for project in \
            samples/Jeninnet.Localization.Reference.Shared.Tests/Jeninnet.Localization.Reference.Shared.Tests.csproj \
            samples/Jeninnet.Localization.Reference.Hosts.Tests/Jeninnet.Localization.Reference.Hosts.Tests.csproj; do
            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --logger "trx;LogFileName=$(basename "$project" .csproj).trx" \
              --results-directory "TestResults/${{ matrix.os }}"
          done

      - name: Test (desktop hosts, Windows only)
        if: matrix.os == 'windows-latest'
        run: >
          dotnet test
          samples/Jeninnet.Localization.Reference.Hosts.Desktop.Tests/Jeninnet.Localization.Reference.Hosts.Desktop.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=desktop.trx"
          --results-directory TestResults/${{ matrix.os }}

      - name: Test (platform host integrations, Windows only)
        if: matrix.os == 'windows-latest'
        run: >
          dotnet test
          tests/Jeninnet.Localization.HostIntegrations.Tests/Jeninnet.Localization.HostIntegrations.Tests.csproj
          --configuration Release
          --no-build
          --blame-hang-timeout 3m
          --logger "trx;LogFileName=host-integrations.trx"
          --results-directory TestResults/${{ matrix.os }}

      - name: Verify Windows host formatting
        if: matrix.os == 'windows-latest'
        run: dotnet format Jeninnet.Localization.Windows.slnx --verify-no-changes --no-restore

      - name: Native AOT smoke (publish + run)
        # The smoke consumer publishes NativeAOT and exercises
        # localize/format/cache/translate. Native AOT (Ahead-of-Time) requires the platform
        # toolchain — clang and zlib on Linux; MSVC on Windows.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
          dotnet publish samples/Jeninnet.Localization.Smoke.Aot/Jeninnet.Localization.Smoke.Aot.csproj -c Release -r linux-x64
          ./samples/Jeninnet.Localization.Smoke.Aot/bin/Release/linux-x64/publish/Jeninnet.Localization.Smoke.Aot

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/${{ matrix.os }}

  package-validation:

    name: Package Validation

    runs-on: windows-latest

    needs:
      - build-and-test

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Restore
        run: |
          dotnet restore Jeninnet.Localization.slnx
          dotnet restore Jeninnet.Localization.Windows.slnx

      - name: Build
        run: |
          dotnet build Jeninnet.Localization.slnx --configuration Release --no-restore
          dotnet build Jeninnet.Localization.Windows.slnx --configuration Release --no-restore

      - name: Pack with Validation
        run: |
          dotnet pack Jeninnet.Localization.slnx --configuration Release --no-build /p:EnablePackageValidation=true
          dotnet pack Jeninnet.Localization.Windows.slnx --configuration Release --no-build /p:EnablePackageValidation=true

  api-compat:

    name: API Compatibility vs Previous Release

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      # Regenerate the committed API baselines from the built assemblies, then diff
      # them against the previous release tag. Every differing content line must be
      # listed in .github/api-compat-acknowledged.txt (deliberate, CHANGELOG-recorded
      # breaks only). Header comments and the UTF-8 BOM are normalized away before
      # comparing so only API lines participate.
      - name: Regenerate baselines and diff against previous release
        shell: bash
        run: |
          TAG=$(git describe --tags --abbrev=0) || { echo "No release tag found; skipping."; exit 0; }
          echo "Baseline tag: $TAG"
          JENINNET_API_REGEN=1 dotnet test tests/Jeninnet.Localization.Tests/Jeninnet.Localization.Tests.csproj \
            -c Release -f net10.0 \
            --filter "FullyQualifiedName~PublicApiBaselines_RegenerateWhenRequested"
          normalize() { sed '1s/^\xef\xbb\xbf//' "$1" | grep -v '^//'; }
          fail=0
          for f in tests/Jeninnet.Localization.Tests/ApiBaselines/*.Api.txt; do
            git show "$TAG:$f" > /tmp/api_base.txt 2>/dev/null || continue
            diff <(normalize /tmp/api_base.txt) <(normalize "$f") | grep '^[<>]' | sed 's/^[<>] //' > /tmp/api_diff.txt || true
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              grep -qxF "$line" .github/api-compat-acknowledged.txt || { echo "UNACKNOWLEDGED API CHANGE: $line"; fail=1; }
            done < /tmp/api_diff.txt
          done
          if [ "$fail" -ne 0 ]; then
            echo "Failing: public-surface differences vs $TAG are not all acknowledged. Record deliberate breaks in .github/api-compat-acknowledged.txt with a CHANGELOG entry."
            exit 1
          fi
          echo "All public-surface differences vs $TAG are acknowledged."

  consumer-validation:

    name: Package Validation (consumer)

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      # The consumers restore from the local feed, so both solutions are packed first. The pack
      # hook in Directory.Build.targets copies every produced package into artifacts/, which
      # consumers/nuget.config uses as a source.
      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Pack the solutions into the local feed
        run: |
          dotnet pack Jeninnet.Localization.slnx --configuration Release
          dotnet pack Jeninnet.Localization.Windows.slnx --configuration Release

      - name: Restore the consumers solution
        run: dotnet restore consumers/Jeninnet.Localization.Consumers.slnx

      - name: Build the consumers solution
        run: dotnet build consumers/Jeninnet.Localization.Consumers.slnx --configuration Release --no-restore

      - name: Test the consumers solution
        run: >
          dotnet test consumers/Jeninnet.Localization.Consumers.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=consumers.trx"
          --results-directory TestResults/consumers

      - name: Run the consumer app
        run: dotnet run --project consumers/Jeninnet.Localization.Consumer --configuration Release --no-build

      - name: Verify consumers formatting
        run: dotnet format consumers/Jeninnet.Localization.Consumers.slnx --verify-no-changes --no-restore

      - name: Upload consumer test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: consumer-test-results
          path: TestResults/consumers

  parity-action:

    name: Parity gate (action dogfood)

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Pack the parity tool into the local feed
        run: dotnet pack src/tooling/Jeninnet.Localization.Tools.Keys/Jeninnet.Localization.Tools.Keys.csproj --configuration Release -o artifacts/parity-dogfood

      # Dogfoods the reusable parity action against the known-clean fixture using
      # the just-packed tool. Findings would fail the job; the upload always runs
      # so the SARIF path is exercised too.
      - name: Run the reusable parity action
        uses: ./.github/actions/parity
        with:
          catalog-dirs: tests/Fixtures/ParityTool/clean/catalogs
          source-dirs: tests/Fixtures/ParityTool/clean/src
          tool-version: 1.0.0-preview.1
          tool-source: ${{ github.workspace }}/artifacts/parity-dogfood
